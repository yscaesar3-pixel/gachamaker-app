workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2

    # ここは「App Store Connect API Key」をCodemagicに登録した時に付けた名前に
    # 書き換えてください(Team settings > Team integrations > Developer Portal)。
    # 既存のoddiro_asc_keyが同じApple Developerチームで使えるならその名前でOKです。
    integrations:
      app_store_connect: oddiro_asc_key

    environment:
      groups:
        - ios_signing
      vars:
        # App Store Connectでアプリのレコードを作った後、
        # 「App情報 > Apple ID」に表示される数字に書き換えてください。
        APP_STORE_APPLE_ID: 6801938807
        BUNDLE_ID: "com.yutaXXX.gachamaker"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: latest

    scripts:
      - name: npm install
        script: |
          npm install

      # このプロジェクトはビルドツール(webpackなど)を使わず、
      # web/ フォルダの中身をそのままCapacitorが読み込む構成のため、
      # 「npm run build」のようなWeb側のビルド工程は不要。
      # npx cap syncが web/ の中身をios/App/App/publicへコピーしてくれる。
      - name: Sync web assets into the iOS project
        script: |
          npx cap sync ios

      - name: Set up keychain to be used for code signing
        script: |
          keychain initialize

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = $PROJECT_BUILD_NUMBER;/" ios/App/App.xcodeproj/project.pbxproj

      - name: Build ipa for distribution
        script: |
          cd $CM_BUILD_DIR
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      # ビルドが終わったら結果をメールで受け取る(任意。不要なら削除してOK)
      email:
        recipients:
          - sekiyubusi@gmail.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        # TestFlightへ自動で提出する(内部テスト用。外部審査には出さない設定)
        submit_to_testflight: true
        # まだApp Storeへの本申請はしない
        submit_to_app_store: false
